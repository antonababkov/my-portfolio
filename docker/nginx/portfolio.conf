# ============================================================
# Nginx: reverse-proxy для приложения (Next.js standalone) + TLS.
#
# Файл НЕ входит в docker-compose: nginx ставится и запускается
# отдельно на хосте VPS (systemd). Так же, как раньше работал Caddy.
# Разворачивается как sites-available/sites-enabled на Debian/Ubuntu:
#
#   cp docker/nginx/portfolio.conf /etc/nginx/sites-available/portfolio.conf
#   ln -s /etc/nginx/sites-available/portfolio.conf /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#
# Апстрим — 127.0.0.1:3000, т.к. сервис app в docker/docker-compose.yml
# опубликован только на loopback ("127.0.0.1:3000:3000").
#
# Сертификаты выпускает certbot (ACME-челлендж через /.well-known/acme-challenge
# на :80), автопродление — certbot.timer.
#
# Домен: ababkov-ao.ru — рабочий, www.ababkov-ao.ru редиректит на него.
# Сертификат покрывает оба имени (SAN), иначе https://www.… падал бы с
# ошибкой несовпадения имени до того, как сработает редирект.
# ============================================================

# Лимит тела запроса. Приложение само отклоняет файлы крупнее 5 МБ
# (src/app/api/upload/route.ts), запас нужен, чтобы отдавать JSON-ошибку 413
# из приложения, а не HTML-ошибку nginx. Дефолт nginx — 1m, он бы сломал
# загрузку фотографий.
client_max_body_size 8m;

# Не отдавать версию nginx (в Caddyfile это было -Server).
server_tokens off;

# --- Лимит запросов -------------------------------------------------------
# Первый рубеж перед rate-limit в приложении (src/lib/rate-limit.ts).
# 5r/m = 1 запрос в 12 с; burst=5 nodelay допускает несколько попыток входа
# подряд (обычная ручная авторизация), дальше — 429, как и отдаёт приложение.
# Лимит считает все запросы к /api/auth/login (успешные тоже), поэтому
# значение подобрано по LOGIN_MAX_ATTEMPTS / LOGIN_WINDOW_MS.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
limit_req_status 429;
limit_req_log_level warn;

# Сжатие на прокси. Дублирует compress: true из next.config.ts, но nginx
# пропускает ответы с уже выставленным Content-Encoding, поэтому двойного
# сжатия нет. zstd/brotli не входят в стоковый nginx (сторонние модули).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/xml
  application/rss+xml
  image/svg+xml;

# --- HTTP: ACME-челлендж Let's Encrypt + редирект на HTTPS ----------------
server {
    listen 80;
    listen [::]:80;
    server_name www.ababkov-ao.ru;

    return 301 https://ababkov-ao.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ababkov-ao.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Литерал домена вместо $host: $host берётся из заголовка Host, и в
    # Location попал бы чужой домен.
    location / {
        return 301 https://ababkov-ao.ru$request_uri;
    }
}

# --- HTTPS ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Директива требует nginx >= 1.25.1. На более старых версиях
    # заменить на listen 443 ssl http2;
    http2 on;

    server_name ababkov-ao.ru;

    ssl_certificate /etc/letsencrypt/live/ababkov-ao.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ababkov-ao.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/ababkov-ao.ru/fullchain.pem;

    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log;

    # Next.js 16 стримит SSR-ответы; с буферизацией на прокси клиент
    # получает ответ целиком и теряет инкрементальный рендеринг.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Connection "" вместо дефолтного "close" — чтобы работал keep-alive
    # к апстриму. Если понадобятся WebSocket, Connection нужно вернуть
    # вместе с Upgrade и map $http_upgrade $connection_upgrade.
    proxy_set_header Connection "";

    # X-Forwarded-For перезаписывается ($remote_addr), а НЕ дописывается
    # ($proxy_add_x_forwarded_for): getClientIp() в src/lib/rate-limit.ts
    # берёт первое значение, и append позволял бы клиенту подставить свой
    # IP в XFF и обойти rate-limit логина.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Security-заголовки (HSTS, CSP, X-Frame-Options, Referrer-Policy,
    # Permissions-Policy, X-Content-Type-Options) намеренно не задаются:
    # их уже отдаёт Next (next.config.ts -> headers()). add_header в nginx
    # добавляет заголовок, а не заменяет — при дубле HSTS браузер возьмёт
    # более жёсткий max-age, и расхождение с next.config.ts вводит в
    # заблуждение.

    # Грубый лимит на подбор пароля — до того, как запрос дойдёт до приложения.
    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# --- HTTPS для www: тот же сертификат, только редирект на рабочий домен -----
# Без этого блока запрос на https://www.… не нашёл бы подходящего server_name
# и получил бы сертификат основного домена — браузер показал бы ошибку
# несовпадения имени вместо редиректа.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.ababkov-ao.ru;

    ssl_certificate /etc/letsencrypt/live/ababkov-ao.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ababkov-ao.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://ababkov-ao.ru$request_uri;
}